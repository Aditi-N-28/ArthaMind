name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust VPS host key
        run: |
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Sync source to VPS
        run: |
          rsync -az --delete \
            --exclude .git \
            --exclude .github \
            --exclude node_modules \
            --exclude dist \
            --exclude .env.production \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Build and restart service
        run: |
          ssh "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$DEPLOY_PATH"

          if [ ! -f .env.production ]; then
            echo "Missing $DEPLOY_PATH/.env.production on the VPS." >&2
            exit 1
          fi

          set -a
          . ./.env.production
          set +a
          npm ci --include=dev
          npm run build
          sudo systemctl restart arthamind
          sudo systemctl is-active --quiet arthamind
          REMOTE
